<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú digital</title><style>
:root{--c:#ea580c;--bg:#fff7ed;--ink:#292524;--muted:#78716c;--line:#fed7aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--ink)}header{background:linear-gradient(120deg,#c2410c,var(--c));color:#fff;padding:28px 20px}main{max-width:1050px;margin:auto;padding:20px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:center}.hero h1{margin:0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.bar>*{padding:11px;border-radius:9px;border:1px solid var(--line);font:inherit}.bar input{flex:1;min-width:200px}.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #7c2d120d}.card h3{margin:8px 0}.price{font-size:20px;font-weight:800;color:var(--c)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--c);color:white;font-weight:700;cursor:pointer}button.light{background:#ffedd5;color:#9a3412}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.tag{background:#ffedd5;color:#9a3412;border-radius:99px;padding:5px 9px;font-size:12px}.hidden{display:none}.admin{margin-top:22px}.promo{color:#15803d;font-weight:700}
</style></head><body><header><main><div class="hero"><div><h1>🍕 Menú digital</h1><p>Escaneá el QR, elegí y enviá tu pedido.</p></div><button class="light" onclick="document.getElementById('admin').classList.toggle('hidden')">⚙️ Negocio</button></div></main></header><main><div class="bar"><input id="search" placeholder="Buscar comidas o bebidas..." oninput="render()"><select id="cat" onchange="render()"><option value="">Todas las categorías</option></select></div><div class="layout"><section id="items" class="grid"></section><aside class="panel"><h2>🧺 Pedido</h2><div id="cart"></div><div class="row"><b>Total</b><b id="total">$0</b></div><input id="name" placeholder="Nombre"><br><br><input id="table" placeholder="Mesa o referencia"><br><br><button onclick="sendOrder()">Enviar pedido</button><p id="ok" class="promo"></p></aside></div><section id="admin" class="panel admin hidden"><h2>⚙️ Configuración del menú</h2><p class="muted">Activá o desactivá productos y aplicá promociones.</p><div id="adminList"></div></section></main><script>
const key='menu-products';let data=JSON.parse(localStorage.getItem(key)||'null')||[{id:1,n:'Pizza muzzarella',p:7800,c:'Pizzas',on:true,promo:''},{id:2,n:'Pizza napolitana',p:9000,c:'Pizzas',on:true,promo:'2x1 los martes'},{id:3,n:'Hamburguesa completa',p:7200,c:'Hamburguesas',on:true,promo:''},{id:4,n:'Gaseosa',p:1800,c:'Bebidas',on:true,promo:''},{id:5,n:'Tiramisú',p:3500,c:'Postres',on:false,promo:''}];let cart={};const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('es-AR');function save(){localStorage.setItem(key,JSON.stringify(data))}function render(){let q=$('search').value.toLowerCase(),c=$('cat').value,cats=[...new Set(data.map(x=>x.c))];$('cat').innerHTML='<option value="">Todas las categorías</option>'+cats.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('');$('items').innerHTML=data.filter(x=>x.on&&(!c||x.c===c)&&x.n.toLowerCase().includes(q)).map(x=>`<article class="card"><span class="tag">${x.c}</span><h3>${x.n}</h3>${x.promo?`<p class="promo">🎁 ${x.promo}</p>`:''}<div class="row"><span class="price">${money(x.p)}</span><button onclick="add(${x.id})">Agregar</button></div></article>`).join('')||'<p>No hay productos disponibles.</p>';renderCart();renderAdmin()}function add(id){cart[id]=(cart[id]||0)+1;renderCart()}function del(id){delete cart[id];renderCart()}function renderCart(){let ids=Object.keys(cart);$('cart').innerHTML=ids.length?ids.map(id=>{let x=data.find(a=>a.id==id);return `<div class="row"><span>${x.n}<br><small>${cart[id]} × ${money(x.p)}</small></span><button class="light" onclick="del(${id})">Quitar</button></div>`}).join(''):'<p class="muted">Tu pedido está vacío.</p>';$('total').textContent=money(ids.reduce((s,id)=>s+data.find(x=>x.id==id).p*cart[id],0))}function sendOrder(){if(!Object.keys(cart).length)return alert('Elegí al menos un producto.');if(!$('name').value)return alert('Completá tu nombre.');$('ok').textContent='Pedido enviado ✅ Nº '+Date.now().toString().slice(-6);cart={};renderCart()}function toggle(id){let x=data.find(a=>a.id==id);x.on=!x.on;save();render()}function promo(id){let x=data.find(a=>a.id==id),v=prompt('Promoción',x.promo);if(v!==null){x.promo=v;save();render()}}function renderAdmin(){$('adminList').innerHTML=data.map(x=>`<div class="row"><span>${x.on?'🟢':'🔴'} ${x.n} — ${money(x.p)}</span><span><button class="light" onclick="promo(${x.id})">Promo</button> <button class="light" onclick="toggle(${x.id})">${x.on?'Ocultar':'Mostrar'}</button></span></div>`).join('')}render();
</script></body></html>
